<!doctype html><html lang="fr"><head><meta charset="utf-8">


<style>@font-face{font-family:Inter;src:url(/fonts/Inter-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}</style><style>
:root{--bg:#f6f4ee;--fg:#0a1428;--accent:#8082d4;--muted:#0a1428;--soft:#edeef9;--line:#d5d5d2;--card:#fffdf9;--edge:#afb1b3;--edge_w:2px;--on_acc:#ffffff;--plate:#fffdf9;--mark:#d6d7f1;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
body{font-family:'Inter','Inter',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
.c{position:relative;width:1080px;height:1350px;padding:48px 64px 38px;display:flex;flex-direction:column;
  background:radial-gradient(circle at 90% 6%,var(--soft) 0,transparent 42%),var(--bg)}
.serif{font-family:'Inter','Gentium Plus',Georgia,serif}
.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.head{flex:0 0 auto;max-height:280px;overflow:hidden;display:flex;flex-direction:column;text-align:center}
.inner{display:flex;flex-direction:column}
h1{font-family:'Inter','Gentium Plus',Georgia,serif;line-height:1.05;font-weight:700;letter-spacing:-.01em}
h1 mark{color:inherit;padding:0 .06em;background:linear-gradient(transparent 18%,var(--mark) 18%,var(--mark) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{color:var(--muted);margin-top:16px;line-height:1.3}
.bar{width:120px;height:7px;border-radius:9px;background:var(--accent);margin:20px auto 24px;flex-shrink:0}
.acc{color:var(--accent)}
.fit{overflow-wrap:break-word}
.foot{display:flex;justify-content:space-between;align-items:center;padding-top:22px;font-size:28px;font-weight:600;color:var(--fg);gap:20px;position:relative;flex-shrink:0}
.author{display:flex;align-items:center;gap:14px;max-width:48%}
.author-avatar{width:72px;height:72px;object-fit:cover;border-radius:50%;flex-shrink:0}
.foot .cta{max-width:42%}
.foot .cta{color:var(--accent)}
.logo{height:52px;max-width:200px;object-fit:contain}
.bl{height:1.08em;width:1.08em;object-fit:contain;vertical-align:-.2em;margin-right:.34em;
  background:#fff;border-radius:.24em;padding:.1em;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.ic img{width:60%;height:60%;object-fit:contain}
.hd{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}.r{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}.a,.b{padding:24px 26px;border-radius:18px;font-weight:700;line-height:1.25}.a{border:var(--edge_w) solid var(--line);color:var(--muted);background:var(--card)}.b{border:var(--edge_w) solid var(--accent);background:var(--soft)}
.c{background:repeating-linear-gradient(90deg,rgba(40,40,30,.035) 0 2px,transparent 2px 26px),var(--bg)}.head .inner{align-items:center;text-align:center}.sub{font-style:italic}.bar{width:100%;height:2px;background:var(--line);margin:26px 0 32px}.card .h,.rk .h,.br .h,.rl .h,.it b,.pt,.sec .h,.aw{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}.k:nth-child(6n+1){background:#e5f4d8;border-color:#8cc26b}.k:nth-child(6n+2){background:#fcf1c4;border-color:#d9b640}.k:nth-child(6n+3){background:#ebe3fb;border-color:#a58ae3}.k:nth-child(6n+4){background:#fde1e9;border-color:#e3849f}.k:nth-child(6n+5){background:#dcf0fa;border-color:#6fb1dc}.k:nth-child(6n+6){background:#fde4d0;border-color:#e39c63}
.s-creme .card .h{font-family:'Inter','Gentium Plus',Georgia,serif}
</style></head>
<body class="s-papier t-avant_apres"><div class="c" data-preserve-text>
<div class="head" data-box><div class="inner">
<h1 class="fit" data-fit="90">Tourner <mark>sans improviser</mark></h1><div class="sub fit" data-fit="34">3 réflexes avant d’appuyer sur REC</div>
</div></div>
<div class="bar"></div>
<div class="grow" data-box><div class="inner">
<div class="hd"><div class="fit" data-fit="32" data-min="28">Avant</div><div class="acc fit" data-fit="32" data-min="28">Après</div></div><div class="r"><div class="a fit" data-fit="34" data-min="28">✕ Tout improviser</div><div class="b fit" data-fit="34" data-min="28">✓ Écrire un script court</div></div><div class="r"><div class="a fit" data-fit="34" data-min="28">✕ Rattraper le son au montage</div><div class="b fit" data-fit="34" data-min="28">✓ Tester le son</div></div><div class="r"><div class="a fit" data-fit="34" data-min="28">✕ Filmer à contre-jour</div><div class="b fit" data-fit="34" data-min="28">✓ Tourner face à la fenêtre</div></div>
</div></div>
<div class="foot"><span class="author">Ludovic Nédélec</span><img class="logo" src="/logo.png" alt=""><span class="cta">Gardez cette fiche</span></div>
</div>
<script>
(function(){
  // Mesure du texte SUR UNE LIGNE : `scrollWidth` ne dépasse pas `clientWidth`
  // quand le texte est en `nowrap` (il déborde en peinture, pas en défilement),
  // donc un grand chiffre était rogné sans jamais être réduit.
  var probe = null;
  function textWidth(el){
    if (!probe) { probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden';
      document.body.appendChild(probe); }
    var cs = getComputedStyle(el);
    ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','textTransform',
     'fontVariantNumeric'].forEach(function(k){ probe.style[k] = cs[k]; });
    probe.textContent = el.textContent || '';
    return probe.getBoundingClientRect().width;
  }
  function wider(el){
    var ws = getComputedStyle(el).whiteSpace;
    if (ws === 'nowrap' || ws === 'pre') return textWidth(el) > el.clientWidth - 1;
    return el.scrollWidth > el.clientWidth + el._s * 0.08;
  }
  function fitBox(box){
    var inner = box.querySelector('.inner') || box;
    var fits = Array.prototype.slice.call(box.querySelectorAll('[data-fit]'))
      .filter(function(el){return el.closest('[data-box]') === box;});
    // Plancher relevé de 38 % à 62 % de la taille de base : en dessous, le
    // texte devient illisible sur un visuel (retour Ludovic, 20 sept. :
    // « c'est écrit trop petit »). Ce qui ne tient toujours pas est COUPÉ
    // proprement par `trimToFit`, jamais rogné par le cadre.
    // Plancher : 62 % de la taille de base, et JAMAIS sous 22 px sur une image
    // de 1080 px de large (retour Ludovic, 20 sept. : « c'est écrit trop
    // petit »). Ce qui ne rentre toujours pas est raccourci par `trimToFit` :
    // moins de mots, mais lisibles, jamais rognés par le cadre.
    // La carte de post garde sa liste entière : elle a le droit de descendre
    // jusqu'au plancher absolu de 22 px avant de refuser le rendu.
    // Mode serré (body[data-dense]) : second essai d'une infographie trop
    // dense, avant tout raccourci (cf. infographic_templates.render_to_file).
    var dense = document.body.hasAttribute('data-dense');
    var plancher = box.classList.contains('tw') ? 0.40 : (dense ? 0.46 : 0.62);
    var absolu = dense ? 17 : 22;
    // Les accroches partent très grand (90-150 px) : elles ont le droit de
    // descendre bien plus bas avant qu'on les raccourcisse (retour bêta,
    // 23 sept. 2026 : « les hooks sont parfois trop longs et coupés »).
    // Mode serré : le plancher `data-min` des explications (28 px) descend à
    // 24 px, dernier recours d'une infographie après la relecture par l'IA.
    fits.forEach(function(el){ el._s = parseFloat(el.getAttribute('data-fit'));
                               var p = /(^|[ -])hook/.test(el.className) ? Math.min(plancher, 0.38) : plancher;
                               var dmin = parseFloat(el.dataset.min || '0');
                               if (dense) dmin = Math.min(dmin, 24);
                               el._min = Math.max(dmin, el._s * p, Math.min(absolu, el._s));
                               el.style.fontSize = el._s + 'px'; });
    var cs = getComputedStyle(box);
    var room = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Case ronde (data-round, le sujet central de la carte mentale) : chaque
    // ligne de texte doit tenir DANS le disque, coins compris. Le carré inscrit
    // seul laissait un mot long sortir du rond (retour banc d'essai, 29 sept. 2026).
    var round = box.hasAttribute('data-round');
    function outOfRound(){
      var bb = box.getBoundingClientRect(), R = bb.width / 2 - 4;
      var cx = bb.left + bb.width / 2, cy = bb.top + bb.height / 2;
      return fits.some(function(el){
        var rg = document.createRange(); rg.selectNodeContents(el);
        return Array.prototype.some.call(rg.getClientRects(), function(q){
          return [[q.left, q.top], [q.right, q.top], [q.left, q.bottom], [q.right, q.bottom]]
            .some(function(p){ return Math.hypot(p[0] - cx, p[1] - cy) > R; });
        });
      });
    }
    function over(){
      if (inner !== box && inner.offsetHeight > room + 1) return true;
      if (round && outOfRound()) return true;
      return fits.some(wider);
    }
    // Peu de texte : on l'AGRANDIT pour remplir la place (retour bêta,
    // 23 sept. 2026 : « texte trop petit avec trop d'espace non rempli »),
    // jusqu'à 1,6 fois la taille de base, puis on revient d'un cran si ça
    // déborde.
    if (!box.classList.contains('tw') && !over()) {
      var g = 0;
      while (!over() && g < 12) {
        fits.forEach(function(el){ el._s = el._s * 1.04; el.style.fontSize = el._s + 'px'; });
        g++;
        if (fits.some(function(el){ return el._s > parseFloat(el.getAttribute('data-fit')) * 1.6; })) break;
      }
      if (over()) fits.forEach(function(el){ el._s = el._s / 1.04; el.style.fontSize = el._s + 'px'; });
    }
    var guard = 0;
    while (over() && guard < 80) {
      var moved = false;
      fits.forEach(function(el){
        if (el._s > el._min) { el._s = Math.max(el._min, el._s * 0.95); el.style.fontSize = el._s + 'px'; moved = true; }
      });
      if (!moved) break;
      guard++;
    }
    // Toujours trop long à la taille plancher : on raccourcit le TEXTE, mot à
    // mot, avec une ellipse. Un mot en moins vaut mieux qu'un mot coupe.
    if (over() && (box.classList.contains('tw') || box.closest('[data-preserve-text]'))) {
      // Une liste sociale ne doit jamais perdre ses derniers éléments.
      // Texte préservé : rien n'est coupé, on MESURE le débord (place qu'il
      // faudrait / place disponible) pour que l'appelant fasse reformuler
      // les textes de cette case (infographic_templates, relecture par l'IA).
      box.dataset.overflow = '1';
      var fill = (inner !== box && room > 0) ? inner.offsetHeight / room : 1;
      fits.forEach(function(el){
        if (!wider(el) || el.clientWidth <= 0) return;
        var ws = getComputedStyle(el).whiteSpace;
        var w = (ws === 'nowrap' || ws === 'pre') ? textWidth(el) : el.scrollWidth;
        fill = Math.max(fill, w / el.clientWidth);
      });
      box.dataset.fill = Math.max(fill, 1.05).toFixed(3);
    } else if (over()) trimToFit(box, fits, over);
  }

  function trimToFit(box, fits, over){
    var cible = fits.slice().sort(function(a, b){
      return (b.textContent || '').length - (a.textContent || '').length; })[0];
    if (!cible) return;
    var mots = (cible.textContent || '').trim().split(/ +/);
    var guard = 0;
    // Signalé à l'utilisateur : un texte raccourci ne l'est jamais en silence.
    if (over()) document.body.setAttribute('data-trimmed', '1');
    while (over() && mots.length > 2 && guard < 60) {
      mots.pop();
      cible.textContent = mots.join(' ').replace(/[ ,;:.…-]+$/, '') + '…';
      guard++;
    }
  }
  // Cases voisines de même type (cartes d'une grille, branches d'une carte
  // mentale…) : chaque case réglait sa taille seule, un titre sortait deux fois
  // plus petit que son voisin (retour Ludovic, 27 sept. 2026). Tout le groupe prend
  // le rapport (taille / taille de base) de sa case la plus serrée : la hiérarchie
  // titre > texte est gardée, et réduire ne fait jamais déborder.
  function harmonize(){
    var groups = new Map();
    // Même parent ET même type de case : la zone du titre et celle du contenu sont
    // voisines, mais le titre ne doit jamais suivre la taille du contenu.
    var ids = new Map();
    document.querySelectorAll('[data-box]').forEach(function(box){
      if (!ids.has(box.parentElement)) ids.set(box.parentElement, ids.size);
      var key = ids.get(box.parentElement) + '|' + box.className;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(box);
    });
    function own(box){
      return Array.prototype.slice.call(box.querySelectorAll('[data-fit]'))
        .filter(function(el){ return el.closest('[data-box]') === box && parseFloat(el.style.fontSize); });
    }
    groups.forEach(function(boxes){
      if (boxes.length < 2) return;
      var f = Infinity;
      boxes.forEach(function(box){ own(box).forEach(function(el){
        f = Math.min(f, parseFloat(el.style.fontSize) / parseFloat(el.getAttribute('data-fit'))); }); });
      if (!isFinite(f)) return;
      boxes.forEach(function(box){ own(box).forEach(function(el){
        var cur = parseFloat(el.style.fontSize);
        var target = Math.max(parseFloat(el.getAttribute('data-fit')) * f, el._min || 0);
        el.style.fontSize = Math.min(cur, target) + 'px'; }); });
    });
  }
  function run(){
    document.querySelectorAll('[data-box]').forEach(fitBox);
    harmonize();
    document.body.setAttribute('data-ready', '1');
  }
  if (document.fonts && document.fonts.ready) {
    Promise.race([document.fonts.ready,
                  new Promise(function(r){ setTimeout(r, 2500); })]).then(run);
  } else { run(); }
})();
</script>
</body></html>
